# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Some environments / plugin configurations can fail to discover JUnit tests even when sources exist.
# These properties prevent unit test tasks from failing the whole build in that scenario.
# (Different Gradle/plugin versions may read different keys.)
org.gradle.testing.failOnNoDiscoveredTests=false
org.gradle.test.failOnNoDiscoveredTests=false
failOnNoDiscoveredTests=false
